<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <style>
      :root {
        --ink: #101828;
        --ink-muted: #667085;
        --paper: #fafaf9;
        --surface: #ffffff;
        --border: #e4e7ec;
        --accent: #2d6c60;
        --accent-strong: #162f2a;
        --gold: #bcab7b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'Cairo', system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 18% 15%, rgba(188, 171, 123, 0.1) 0%, transparent 45%),
          linear-gradient(160deg, #1c3c34 0%, var(--accent-strong) 55%, #0d211c 100%);
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--ink-muted);
      }
      button {
        width: 100%;
        padding: 12px;
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        color: #fff;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        يحتاج التطبيق إلى الاتصال لعرض بيانات الطلاب المحدّثة. تحقّق من اتصالك ثم حاول
        مرة أخرى.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
